name: ci
on:
  push:
  pull_request:
jobs:
  python-and-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .[dev]
      - run: pytest -q
      - run: bash scripts/verify_patch.sh
      - run: bash tests/c_host/run_host_test.sh
