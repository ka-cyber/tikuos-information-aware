# Shared configuration for the clustering daemon and RLNC service,
# matching the paper's default parameters (Section 3/5).
apiVersion: v1
kind: ConfigMap
metadata:
  name: apc-rlnc-config
  namespace: apc-rlnc
data:
  EPOCH_DURATION: "1.5s"        # tau reconfiguration period (Section 3.5)
  EWMA_ALPHA: "0.2"             # Eq. 2 smoothing factor
  CLUSTERING_LAMBDA: "0.01"     # Eq. 3 regularizer
  GOSSIP_ROUNDS: "5"            # Algorithm 1 R_max
  GENERATION_SIZE_K: "32"       # RLNC generation size
  BETA_SAFETY_MARGIN: "1.5"     # Eq. 4 redundancy safety margin
  CHURN_RATE: "0.02"            # rho_churn (nominal conditions default)
  WIRELESS_INTERFACE: "wlan0"
